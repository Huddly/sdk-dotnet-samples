name: Build solution
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  release:
    types: [published]
  pull_request:
    branches:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build solution
        shell: bash
        run: dotnet build

      # Hosted runners have no Huddly camera, so this runs only the tests that expect none: every
      # sample must wait for a device and then exit with a failure code. The tests against a real
      # camera (Category=Device) run on hardware from sdk-dotnet.
      - name: Run samples without a device
        shell: bash
        run: dotnet test --no-build --filter "Category=NoDevice"
