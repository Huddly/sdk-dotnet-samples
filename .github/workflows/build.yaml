name: Build solution
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  release:
    types: [published]
  pull_request:
    branches:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build solution
        shell: bash
        run: dotnet build
